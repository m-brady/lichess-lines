<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Lichess Lines</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1a1a1a;
    --panel: #242424;
    --border: #333;
    --text: #e8e8e8;
    --muted: #888;
    --win: #4a9d4a;
    --draw: #888;
    --loss: #c44;
    --accent: #d18b47;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
  h1 { margin: 0; font-size: 20px; }
  .accounts { color: var(--muted); font-size: 12px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  label { color: var(--muted); font-size: 12px; margin-right: 4px; }
  select, input, button {
    background: #2e2e2e;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 4px 8px;
    font: inherit;
  }
  option {
    background: #2e2e2e;
    color: var(--text);
  }
  option:checked {
    background: var(--accent);
    color: #1a1a1a;
  }
  button { cursor: pointer; }
  button:hover { background: #3a3a3a; }
  button.preset { background: #333; }
  button.preset.active { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
  .bar { display: flex; height: 24px; border-radius: 4px; overflow: hidden; margin: 8px 0; }
  .bar > div { display: flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; min-width: 0; }
  .bar .w { background: var(--win); }
  .bar .d { background: var(--draw); }
  .bar .l { background: var(--loss); }
  .crumbs { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--accent); word-break: break-all; }
  .crumbs span { cursor: pointer; }
  .crumbs span:hover { text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: normal; font-size: 12px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #2e2e2e; }
  td.san { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.opening { color: var(--muted); font-size: 12px; }
  .mini-bar { display: inline-flex; height: 8px; width: 80px; border-radius: 2px; overflow: hidden; vertical-align: middle; }
  .mini-bar > div { height: 100%; }
  .empty, .loading, .error { padding: 24px; text-align: center; color: var(--muted); }
  .error { color: var(--loss); }
  .totals { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .indexing {
    background: #3a2e1a;
    border: 1px solid #5a4422;
    color: #e5c07b;
    border-radius: 4px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .indexing button { background: #5a4422; border-color: #6a5430; color: #e5c07b; }
  .indexing button:hover { background: #6a5430; }
  .indexing .spinner {
    width: 10px; height: 10px; border-radius: 50%;
    background: #e5c07b; opacity: 0.6;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    background: #3a2e1a;
    color: #e5c07b;
    font-size: 11px;
    margin-left: 4px;
  }
  button.running { background: #5a2222; border-color: #6a3030; color: #f0c0c0; }
  .scan-meta { color: var(--muted); font-size: 12px; }
  .scan-progress { color: var(--muted); font-size: 12px; padding: 8px 0; }
  .scan-empty { color: var(--muted); font-size: 13px; padding: 12px 0; }
  .scan-row {
    display: grid;
    grid-template-columns: 56px auto 1fr auto;
    grid-template-areas:
      "pain line   line  meta"
      "pain bar    bar   bar"
      "pain opening opening opening";
    column-gap: 10px;
    row-gap: 4px;
    padding: 8px 6px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .scan-row:hover { background: #2e2e2e; }
  .scan-row .pain { grid-area: pain; align-self: center; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--loss); }
  .scan-row .line {
    grid-area: line;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    word-break: break-all;
  }
  .scan-row .meta { grid-area: meta; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .scan-row .bar { grid-area: bar; height: 6px; border-radius: 2px; overflow: hidden; display: flex; }
  .scan-row .bar > div { height: 100%; }
  .scan-row .opening { grid-area: opening; color: var(--muted); font-size: 12px; }

  @media (max-width: 600px) {
    .wrap { padding: 12px 8px; }

    #movesPanel thead { display: none; }
    #movesPanel table,
    #movesPanel tbody { display: block; }

    #movesPanel tbody tr {
      display: grid;
      grid-template-columns: 56px auto auto 1fr auto;
      grid-template-areas:
        "san games share .   ."
        "san bar   bar   bar wdl"
        "san elo   elo   elo elo"
        "san opening opening opening opening";
      column-gap: 8px;
      row-gap: 4px;
      padding: 10px 6px;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    #movesPanel td { padding: 0; border: none; }
    #movesPanel td.san {
      grid-area: san;
      align-self: center;
      font-size: 18px;
    }
    #movesPanel td:nth-child(2) {
      grid-area: games;
      text-align: left;
      color: var(--muted);
      font-size: 12px;
    }
    #movesPanel td:nth-child(2)::after { content: " games"; }
    #movesPanel td:nth-child(3) {
      grid-area: share;
      text-align: left;
      color: var(--muted);
      font-size: 12px;
    }
    #movesPanel td:nth-child(3)::before { content: "· "; }
    #movesPanel td:nth-child(4) { grid-area: bar; }
    #movesPanel td:nth-child(5) { grid-area: wdl; }
    #movesPanel td:nth-child(6) {
      grid-area: elo;
      text-align: left;
      color: var(--muted);
      font-size: 12px;
    }
    #movesPanel td:nth-child(6):not(:empty)::before { content: "opp "; }
    #movesPanel td.opening {
      grid-area: opening;
      white-space: normal;
      word-break: break-word;
    }
    #movesPanel .mini-bar { width: 100%; max-width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Lichess Lines</h1>
    <div class="accounts" id="accounts"></div>
  </header>

  <div class="panel">
    <div class="row">
      <strong>Preset:</strong>
      <button class="preset" data-preset="italian">Italian (White)</button>
      <button class="preset" data-preset="caro">Caro-Kann (Black)</button>
      <button class="preset" data-preset="slav">Slav (Black)</button>
      <button class="preset" data-preset="white-e4">All 1.e4 (White)</button>
      <button class="preset" data-preset="black-vs-e4">All vs 1.e4 (Black)</button>
      <button class="preset" data-preset="black-vs-d4">All vs 1.d4 (Black)</button>
    </div>
    <div class="row">
      <label>Speeds</label>
      <select id="speeds" multiple size="1" style="width:auto">
        <option value="bullet">bullet</option>
        <option value="blitz" selected>blitz</option>
        <option value="rapid" selected>rapid</option>
        <option value="classical">classical</option>
        <option value="correspondence">correspondence</option>
      </select>
      <label>Modes</label>
      <select id="modes">
        <option value="">all</option>
        <option value="rated" selected>rated</option>
        <option value="casual">casual</option>
      </select>
      <label>Since</label>
      <input id="since" type="month" />
      <button id="reset">Reset to preset</button>
      <button id="back">← Back</button>
      <button id="scan" title="Walk this opening for the worst sub-lines you face">Scan weak lines</button>
    </div>
  </div>

  <div id="indexingBanner" style="display:none"></div>

  <div class="panel">
    <div><strong>Line:</strong> <span class="crumbs" id="crumbs"></span></div>
    <div id="opening" style="color:var(--muted); margin-top:4px"></div>
    <div class="bar" id="bar"></div>
    <div class="totals" id="totals"></div>
  </div>

  <div class="panel" id="scanPanel" style="display:none">
    <div class="row" style="justify-content:space-between">
      <strong id="scanTitle">Weak lines</strong>
      <span class="scan-meta" id="scanMeta"></span>
    </div>
    <div id="scanBody"></div>
  </div>

  <div class="panel" id="movesPanel">
    <div class="loading">Loading…</div>
  </div>
</div>

<script>
const PRESETS = {
  italian:       { color: "white", play: ["e2e4", "e7e5", "g1f3", "b8c6", "f1c4"], label: "Italian (White)" },
  caro:          { color: "black", play: ["e2e4", "c7c6"],                          label: "Caro-Kann (Black)" },
  slav:          { color: "black", play: ["d2d4", "d7d5", "c2c4", "c7c6"],          label: "Slav (Black)" },
  "white-e4":    { color: "white", play: ["e2e4"],                                  label: "1.e4 (White)" },
  "black-vs-e4": { color: "black", play: ["e2e4"],                                  label: "vs 1.e4 (Black)" },
  "black-vs-d4": { color: "black", play: ["d2d4"],                                  label: "vs 1.d4 (Black)" },
};

// UCI -> SAN at known starting positions for breadcrumbs. Tiny lookup; for moves
// already in the play sequence (presets) we know SAN. New moves come back from API.
const KNOWN_SAN = {
  e2e4: "e4", e7e5: "e5", c7c6: "c6", g1f3: "Nf3", b8c6: "Nc6", f1c4: "Bc4",
  d2d4: "d4", d7d5: "d5", b1c3: "Nc3", c2c4: "c4",
};

let state = {
  presetKey: "italian",
  color: "white",
  play: PRESETS.italian.play.slice(),
  sanHistory: PRESETS.italian.play.map((u) => KNOWN_SAN[u] || u),
};

const $ = (id) => document.getElementById(id);

async function loadAccounts() {
  try {
    const r = await fetch("/api/users");
    const j = await r.json();
    $("accounts").textContent = j.users.length ? j.users.join(" + ") : "(no users configured)";
  } catch {
    $("accounts").textContent = "(failed to load users)";
  }
}

function setPreset(key) {
  const p = PRESETS[key];
  state.presetKey = key;
  state.color = p.color;
  state.play = p.play.slice();
  state.sanHistory = p.play.map((u) => KNOWN_SAN[u] || u);
  document.querySelectorAll(".preset").forEach((b) => {
    b.classList.toggle("active", b.dataset.preset === key);
  });
  refresh();
  maybeRenderCachedScan();
}

function buildQueryFor(play, color = state.color) {
  const params = new URLSearchParams();
  params.set("color", color);
  if (play.length) params.set("play", play.join(","));
  const speeds = [...$("speeds").selectedOptions].map((o) => o.value);
  if (speeds.length) params.set("speeds", speeds.join(","));
  const modes = $("modes").value;
  if (modes) params.set("modes", modes);
  const since = $("since").value; // YYYY-MM
  if (since) params.set("since", since);
  return params.toString();
}

function buildQuery() {
  return buildQueryFor(state.play, state.color);
}

function fmtPct(n, total) {
  if (!total) return "0%";
  return Math.round((n / total) * 100) + "%";
}

function renderCrumbs() {
  const el = $("crumbs");
  el.innerHTML = "";
  if (!state.sanHistory.length) {
    el.textContent = "(start)";
    return;
  }
  state.sanHistory.forEach((san, i) => {
    const span = document.createElement("span");
    const moveNum = state.color === "white" ? Math.floor(i / 2) + 1 : Math.floor((i + 1) / 2) + (i === 0 ? 0 : 0);
    // simpler numbering: increment on white's move (even index from start)
    const num = Math.floor(i / 2) + 1;
    span.textContent = (i % 2 === 0 ? `${num}.` : "") + san + " ";
    span.title = "Truncate line here";
    span.onclick = () => {
      state.play = state.play.slice(0, i + 1);
      state.sanHistory = state.sanHistory.slice(0, i + 1);
      refresh();
    };
    el.appendChild(span);
  });
}

function renderBar(white, draws, black) {
  const total = white + draws + black;
  const userWins = state.color === "white" ? white : black;
  const userLosses = state.color === "white" ? black : white;
  const bar = $("bar");
  bar.innerHTML = "";
  if (!total) {
    bar.style.display = "none";
    return;
  }
  bar.style.display = "flex";
  const wPct = (userWins / total) * 100;
  const dPct = (draws / total) * 100;
  const lPct = (userLosses / total) * 100;
  bar.innerHTML =
    `<div class="w" style="width:${wPct}%">${wPct > 8 ? `${userWins}W` : ""}</div>` +
    `<div class="d" style="width:${dPct}%">${dPct > 8 ? `${draws}D` : ""}</div>` +
    `<div class="l" style="width:${lPct}%">${lPct > 8 ? `${userLosses}L` : ""}</div>`;
}

function renderTotals(data) {
  const total = data.games;
  const userWins = state.color === "white" ? data.white : data.black;
  const userLosses = state.color === "white" ? data.black : data.white;
  const score = total ? ((userWins + data.draws / 2) / total * 100).toFixed(1) : "0.0";
  const head = [
    `${total} games`,
    `score ${score}%`,
    `${fmtPct(userWins, total)} W / ${fmtPct(data.draws, total)} D / ${fmtPct(userLosses, total)} L`,
  ].map((t) => `<span>${t}</span>`).join(" · ");
  const perUser = Object.entries(data.perUser).map(([user, s]) => {
    const t = s.white + s.draws + s.black;
    let badge = "";
    if (s.queuePosition !== undefined) {
      badge = s.queuePosition > 0
        ? `<span class="badge">queued #${s.queuePosition}</span>`
        : `<span class="badge">indexing…</span>`;
    }
    return `<span>${user}: ${t}${badge}</span>`;
  }).join(" · ");
  $("totals").innerHTML = perUser ? `${head} · ${perUser}` : head;
}

function renderIndexingBanner(data) {
  const banner = $("indexingBanner");
  const indexing = Object.entries(data.perUser).filter(
    ([, s]) => s.queuePosition !== undefined,
  );
  if (!indexing.length) {
    banner.style.display = "none";
    banner.innerHTML = "";
    return;
  }
  const parts = indexing.map(([user, s]) =>
    s.queuePosition > 0
      ? `<strong>${user}</strong> (queued #${s.queuePosition})`
      : `<strong>${user}</strong> (indexing now)`,
  );
  banner.style.display = "flex";
  banner.className = "indexing";
  banner.innerHTML =
    `<span class="spinner"></span>` +
    `<span>Lichess is still building the opening index for ${parts.join(", ")}. ` +
    `Totals shown are partial — Recheck to query Lichess again.</span>` +
    `<button id="recheck" style="margin-left:auto">Recheck</button>`;
  $("recheck").onclick = () => refresh(true);
}

function renderMoves(moves, parentOpening) {
  const panel = $("movesPanel");
  if (!moves.length) {
    panel.innerHTML = '<div class="empty">No moves at this position.</div>';
    return;
  }
  const totalGames = moves.reduce((s, m) => s + m.games, 0);
  const rows = moves.map((m) => {
    const userWins = state.color === "white" ? m.white : m.black;
    const userLosses = state.color === "white" ? m.black : m.white;
    const wp = (userWins / m.games) * 100;
    const dp = (m.draws / m.games) * 100;
    const lp = (userLosses / m.games) * 100;
    const sharePct = ((m.games / totalGames) * 100).toFixed(1);
    const named = m.opening || parentOpening;
    const opening = named ? `${named.eco} ${named.name}` : "";
    return `
      <tr data-uci="${m.uci}" data-san="${m.san}">
        <td class="san">${m.san}</td>
        <td class="num">${m.games}</td>
        <td class="num">${sharePct}%</td>
        <td>
          <span class="mini-bar">
            <div style="width:${wp}%;background:var(--win)"></div>
            <div style="width:${dp}%;background:var(--draw)"></div>
            <div style="width:${lp}%;background:var(--loss)"></div>
          </span>
        </td>
        <td class="num">${Math.round(wp)}/${Math.round(dp)}/${Math.round(lp)}</td>
        <td class="num">${m.averageOpponentRating}</td>
        <td class="opening">${opening}</td>
      </tr>`;
  }).join("");
  panel.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Move</th><th class="num">Games</th><th class="num">Share</th>
          <th>Result (you)</th><th class="num">W/D/L %</th><th class="num">Opp Elo</th><th>Opening</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>`;
  panel.querySelectorAll("tbody tr").forEach((tr) => {
    tr.onclick = () => {
      state.play.push(tr.dataset.uci);
      state.sanHistory.push(tr.dataset.san);
      refresh();
    };
  });
}

async function refresh(fresh = false) {
  renderCrumbs();
  $("movesPanel").innerHTML = '<div class="loading">Loading…</div>';
  try {
    const qs = buildQuery() + (fresh ? "&fresh=1" : "");
    const r = await fetch("/api/explorer?" + qs);
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      throw new Error(j.error || `HTTP ${r.status}`);
    }
    const data = await r.json();
    $("opening").textContent = data.opening ? `${data.opening.eco} ${data.opening.name}` : "";
    renderIndexingBanner(data);
    renderBar(data.white, data.draws, data.black);
    renderTotals(data);
    renderMoves(data.moves, data.opening);
  } catch (e) {
    $("movesPanel").innerHTML = `<div class="error">${e.message}</div>`;
  }
}

const SCAN = {
  MIN_GAMES: 5,
  MIN_OPP_SHARE: 0.05,
  // Lower threshold than opponents': we want to catch your secondary repertoire
  // (e.g. you play c3 60% but also Center Attack 30%) and not just your main line.
  MIN_USER_SHARE: 0.25,
  MAX_DEPTH_PLIES: 12,
  CONCURRENCY: 4,
  TOP_RESULTS: 15,
};

let scanRun = null; // { abort: false } while running, else null

function scanCacheKey() {
  const speeds = [...$("speeds").selectedOptions].map((o) => o.value).join(",");
  const modes = $("modes").value;
  const since = $("since").value;
  // Keyed by the *preset* root + filters, not the user's current navigation.
  const root = PRESETS[state.presetKey];
  return `lichess-lines:scan:v1:${state.presetKey}:${root.color}:${root.play.join(",")}:${speeds}:${modes}:${since}`;
}

function loadScanFromStorage() {
  try {
    const raw = localStorage.getItem(scanCacheKey());
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function saveScanToStorage(payload) {
  try {
    localStorage.setItem(scanCacheKey(), JSON.stringify(payload));
  } catch {}
}

function fmtAge(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return `${s}s ago`;
  const m = Math.round(s / 60);
  if (m < 60) return `${m}m ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h}h ago`;
  return `${Math.round(h / 24)}d ago`;
}

function sanLineToText(sanArr, rootColor) {
  const out = [];
  for (let i = 0; i < sanArr.length; i++) {
    const num = Math.floor(i / 2) + 1;
    if (i === 0 && rootColor === "white") out.push(`${num}.`);
    else if (i % 2 === 0) out.push(`${num}.`);
    else if (i === 0) out.push(`${num}...`);
    out.push(sanArr[i]);
  }
  return out.join(" ");
}

async function fetchScanPosition(play, color) {
  const qs = buildQueryFor(play, color);
  const r = await fetch("/api/explorer?" + qs);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

async function runScan() {
  if (scanRun) {
    scanRun.abort = true;
    return;
  }
  const run = { abort: false };
  scanRun = run;
  $("scan").textContent = "Stop scan";
  $("scan").classList.add("running");

  const preset = PRESETS[state.presetKey];
  const rootPlay = preset.play.slice();
  const rootSan = preset.play.map((u) => KNOWN_SAN[u] || u);
  const color = preset.color;

  $("scanPanel").style.display = "";
  $("scanTitle").textContent = `Weak lines · ${preset.label}`;
  $("scanMeta").textContent = "";
  $("scanBody").innerHTML = '<div class="scan-progress">Starting…</div>';

  const queue = [{ play: rootPlay, san: rootSan }];
  const seen = new Set();
  const terminals = [];
  let positionsChecked = 0;
  let rootScore = 0.5;
  let rootGames = 0;

  const updateProgress = () => {
    $("scanBody").innerHTML =
      `<div class="scan-progress">Checked ${positionsChecked} positions · ${queue.length + active} in queue…</div>`;
  };

  let active = 0;

  async function visit(node) {
    const key = node.play.join(",");
    if (seen.has(key)) return;
    seen.add(key);
    if (run.abort) return;

    let data;
    try {
      data = await fetchScanPosition(node.play, color);
    } catch (e) {
      console.warn("scan fetch failed", node.san.join(" "), e);
      return;
    }
    positionsChecked++;
    updateProgress();

    const games = data.games;
    if (games < SCAN.MIN_GAMES) return;

    const userWins = color === "white" ? data.white : data.black;
    const userLosses = color === "white" ? data.black : data.white;
    const score = (userWins + data.draws / 2) / games;
    if (node.play.length === rootPlay.length) {
      rootScore = score;
      rootGames = games;
    }
    const whiteToMove = node.play.length % 2 === 0;
    const userToMove = whiteToMove === (color === "white");
    const depthFromRoot = node.play.length - rootPlay.length;

    let branched = false;
    if (depthFromRoot < SCAN.MAX_DEPTH_PLIES) {
      const minShare = userToMove ? SCAN.MIN_USER_SHARE : SCAN.MIN_OPP_SHARE;
      for (const m of data.moves) {
        if (m.games < SCAN.MIN_GAMES) continue;
        if (m.games / games < minShare) continue;
        queue.push({ play: [...node.play, m.uci], san: [...node.san, m.san] });
        branched = true;
      }
    }

    if (!branched) {
      terminals.push({
        play: node.play.slice(),
        san: node.san.slice(),
        games,
        userWins,
        draws: data.draws,
        userLosses,
        score,
        opening: data.opening,
        terminalReason: depthFromRoot >= SCAN.MAX_DEPTH_PLIES ? "depth" : "thin",
      });
    }
  }

  await new Promise((resolve) => {
    const pump = () => {
      if (run.abort) return resolve();
      while (active < SCAN.CONCURRENCY && queue.length > 0) {
        const node = queue.shift();
        active++;
        visit(node).finally(() => {
          active--;
          if (queue.length === 0 && active === 0) resolve();
          else pump();
        });
      }
      if (queue.length === 0 && active === 0) resolve();
    };
    pump();
  });

  scanRun = null;
  $("scan").textContent = "Scan weak lines";
  $("scan").classList.remove("running");

  if (run.abort) {
    $("scanBody").innerHTML = `<div class="scan-empty">Scan stopped after ${positionsChecked} positions.</div>`;
    return;
  }

  const ranked = terminals
    .map((t) => ({ ...t, pain: t.games * Math.max(0, rootScore - t.score) }))
    .filter((t) => t.pain > 0)
    .sort((a, b) => b.pain - a.pain)
    .slice(0, SCAN.TOP_RESULTS);

  const payload = {
    presetKey: state.presetKey,
    color,
    rootPlay,
    rootSan,
    rootScore,
    rootGames,
    ranked,
    positionsChecked,
    scannedAt: Date.now(),
  };
  saveScanToStorage(payload);
  renderScanResults(payload);
}

function renderScanResults(payload) {
  $("scanPanel").style.display = "";
  const preset = PRESETS[payload.presetKey];
  $("scanTitle").textContent = `Weak lines · ${preset ? preset.label : payload.presetKey}`;
  const baselinePct = payload.rootScore !== undefined
    ? `baseline ${Math.round(payload.rootScore * 100)}%`
    : "";
  $("scanMeta").textContent = [
    `${payload.positionsChecked} positions`,
    baselinePct,
    `scanned ${fmtAge(payload.scannedAt)}`,
  ].filter(Boolean).join(" · ");

  if (!payload.ranked.length) {
    $("scanBody").innerHTML =
      `<div class="scan-empty">No sub-lines underperform your baseline at depth ${SCAN.MAX_DEPTH_PLIES} with ≥${SCAN.MIN_GAMES} games. Either you're scoring ≥${Math.round((payload.rootScore || 0.5) * 100)}% everywhere your sample is meaningful, or the data's still thin.</div>`;
    return;
  }

  const rows = payload.ranked.map((t) => {
    const wp = (t.userWins / t.games) * 100;
    const dp = (t.draws / t.games) * 100;
    const lp = (t.userLosses / t.games) * 100;
    const lineText = sanLineToText(t.san, payload.color);
    const opening = t.opening ? `${t.opening.eco} ${t.opening.name}` : "";
    return `
      <div class="scan-row" data-idx="${payload.ranked.indexOf(t)}">
        <div class="pain" title="games × max(0, baseline − score) — points lost vs your average in this opening">${t.pain.toFixed(1)}</div>
        <div class="line">${lineText}</div>
        <div class="meta">${t.games}g · ${Math.round(t.score * 100)}%</div>
        <div class="bar">
          <div style="width:${wp}%;background:var(--win)"></div>
          <div style="width:${dp}%;background:var(--draw)"></div>
          <div style="width:${lp}%;background:var(--loss)"></div>
        </div>
        <div class="opening">${opening}</div>
      </div>`;
  }).join("");

  $("scanBody").innerHTML = rows;
  $("scanBody").querySelectorAll(".scan-row").forEach((el) => {
    el.onclick = () => {
      const t = payload.ranked[Number(el.dataset.idx)];
      state.color = payload.color;
      state.play = t.play.slice();
      state.sanHistory = t.san.slice();
      refresh();
    };
  });
}

function maybeRenderCachedScan() {
  const cached = loadScanFromStorage();
  if (cached && cached.presetKey === state.presetKey) {
    renderScanResults(cached);
  } else {
    $("scanPanel").style.display = "none";
    $("scanBody").innerHTML = "";
  }
}

document.querySelectorAll(".preset").forEach((b) => {
  b.onclick = () => setPreset(b.dataset.preset);
});
$("reset").onclick = () => setPreset(state.presetKey);
$("back").onclick = () => {
  if (state.play.length > 0) {
    state.play.pop();
    state.sanHistory.pop();
    refresh();
  }
};
$("scan").onclick = runScan;
$("speeds").onchange = () => { refresh(); maybeRenderCachedScan(); };
$("modes").onchange = () => { refresh(); maybeRenderCachedScan(); };
$("since").onchange = () => { refresh(); maybeRenderCachedScan(); };

loadAccounts();
setPreset("italian");
</script>
</body>
</html>
